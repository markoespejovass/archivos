openapi: 3.0.1
info:
  title: Customer Card Position
  version: 1.6.0
  description: |-
    This API retrieves information about a customer's card position. The card position is the collective term for the customer's card contracts and contract balances.

    The API can be used to retrieve a customer's card position.
  contact:
    email: apiglobalgovernance@gruposantander.com
  license:
    name: Copyright
    url: https://gluon.gs.corp/community/docs/latest/getting-started/about-gluon/terms-conditions/
servers:
  - url: /v1/customer_card_position
security:
  - Authorization: []
tags:
  - name: Customer card position
    description: Operations related to a customer's card position
paths:
  /:
    get:
      operationId: GetCardPosition
      tags:
        - Customer card position
      summary: Retrieves a customer's card position.
      description: |-
        Retrieves a specific customer's card position.

        If the logged-in person sending the request is a customer, the response includes their information. If the logged-in person sending the request is Santander staff, the customer ID of the customer for whom information is to be retrieved must be provided.

        The card contract data included in the response can be filtered by type and status. The retrieved card contract data can also be grouped by card type or combined.

        Fields to be excluded from the retrieved card contract data can be indicated with the '_fields' parameter.

        The response includes the card customer contract's credit and capability level details, the customer's available credit and credit limit amounts, and the lists of customer cards, including their contracts and balances.
      parameters:
        - $ref: "#/components/parameters/x-santander-client-id"
        - $ref: "#/components/parameters/accept-language"
        - $ref: "#/components/parameters/device-information"
        - $ref: "#/components/parameters/type_code"
        - $ref: "#/components/parameters/group_by_type_code"
        - $ref: "#/components/parameters/filtering_status_code"
        - $ref: "#/components/parameters/customer_id"
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          $ref: "#/components/responses/Get200_CustomerPosition"
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
      x-amazon-apigateway-integration:
        responses:
          default:
            statusCode: "200"
        uri: "ac7cb2f51f17e43919ffac5f9d3956ba-03662cbb457cbc98.elb.us-east-1.amazonaws.com//v1/biometric/token"
        passthroughBehavior: "when_no_match"
        connectionType: "VPC_LINK"
        connectionId: "0lmk4e"
        httpMethod: "GET"
        type: "http_proxy"
components:
  parameters:
    accept-language:
      name: accept-language
      in: header
      required: false
      schema:
        type: string
      description: |-
        Language and country header.

        The value is a 2-letter language code defined in ISO 639-1 alpha-2 followed by a 2-letter country code defined in ISO 3166-1 alpha-2, separated by a hyphen.
      example: es-ES
    customer_id:
      name: customer_id
      in: query
      required: false
      schema:
        type: string
      description: |-
        Customer ID associated with the contracts to be included in the response.

        If the logged-in person is not the customer whose card position is to be retrieved, this parameter must be provided.
      example: F1234567
    device-information:
      name: device-information
      in: header
      schema:
        type: string
      description:
        Device information header containing identification data from the logged-in person's device. The data can be
        used to personalize the user experience.
      example: ISO 639-2/retail/iPhone13/iOS/Darwin/16.3.0
    fields:
      name: _fields
      in: query
      required: false
      schema:
        type: string
      description: |-
        Fields to be excluded from the retrieved card contract data.

        The possible values are the field, data structure, and array names in the response.

        Multiple values can be provided as a comma-separated list.
      example: statusInfo,balances,associatedAccount
    filtering_status_code:
      name: filtering_status_code
      in: query
      required: false
      schema:
        type: string
        enum:
          - active
          - cancelled
          - all
      description:
        Status code for the card contract data to be included in the response. If this parameter is omitted, card
        contract data for all statuses is returned.
      example: active
    group_by_type_code:
      name: group_by_type_code
      in: query
      required: false
      schema:
        type: boolean
        default: true
      description: |-
        Whether the card contract data to be included in the response is grouped by type.

        The possible values are:
        - true = Card contract data is grouped by type and returned in the 'debitCards.list', 'creditCards.list', and 'prepaidCards.list' arrays.
        - false = Card contract data for all card types is returned in the 'cards.list' array.
      example: true
    type_code:
      name: type_code
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
            - debit
            - credit
            - prepaid
          description: Contract type code
          example: debit
      description:
        Array of type codes for the card contract data to be included in the response. If this parameter is omitted,
        card contract data for all card types is returned.
      example:
        - debit
        - credit
    x-santander-client-id:
      name: x-santander-client-id
      in: header
      required: true
      schema:
        type: string
      description: Client ID header
      example: a1b30a84-7bf3-442e-84a0-e935d8163b5a
  responses:
    Get200_CustomerPosition:
      description: |-
        OK.

        Response to a request to retrieve a customer's card position.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WrapperCustomerPositionResponse"
    NoContent:
      description: No content
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
    GatewayTimeout:
      description: Gateway timeout
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
  schemas:
    WrapperCustomerPositionResponse:
      type: object
      description: Data structure containing the response information for retrieving a customer's card position
      properties:
        customerCreditLimit:
          $ref: "#/components/schemas/Amount"
        customerCreditAvailable:
          $ref: "#/components/schemas/Amount"
        cardCustomerContract:
          $ref: "#/components/schemas/CardCustomerContract"
        cards:
          $ref: "#/components/schemas/WrapperCardsInformation"
        debitCards:
          $ref: "#/components/schemas/WrapperDebitCardsInformation"
        creditCards:
          $ref: "#/components/schemas/WrapperCardsInformation"
        prepaidCards:
          $ref: "#/components/schemas/WrapperPrepaidCardsInformation"
    CardCustomerContract:
      type: object
      description:
        Data structure containing information about a card customer contract. This contract is a framework contract for
        all of a customer's cards and contains their total credit limit. Each customer can have only one card customer
        contract.
      properties:
        isCreditLimitAssigned:
          type: boolean
          description: Whether a credit limit is assigned to the card customer contract
          example: true
        capabilityLevel:
          type: string
          description: |-
            Level of capability that a back-end or the card processor can provide. The level determines the quick actions that the front-end can present to the customer. If the customer has multiple card contracts with different capability levels, the customer's overall capability level is considered mixed.

            The possible values are:
            - PA = PAMPA capability level
            - PC = PCAS capability level
            - PL = Plard capability level
            - MX = Mixed capability level
          enum:
            - PA
            - PC
            - PL
            - MX
          example: PL
        hasUnlimitedCredit:
          type: boolean
          description: Whether the card customer contract has unlimited credit
          example: false
    WrapperCardsInformation:
      type: object
      description: Data structure containing the list of cards for the card product family
      properties:
        list:
          type: array
          description: Array of cards
          items:
            $ref: "#/components/schemas/WrapperCardWithLinks"
    WrapperDebitCardsInformation:
      type: object
      description: Data structure containing the list of debit cards for the card product family
      properties:
        list:
          type: array
          description: Array of cards
          items:
            $ref: "#/components/schemas/WrapperDebitCardWithLinks"
    WrapperPrepaidCardsInformation:
      type: object
      description: Data structure containing the list of prepaid cards for the card product family
      properties:
        list:
          type: array
          description: Array of cards
          items:
            $ref: "#/components/schemas/WrapperPrepaidCardWithLinks"
    WrapperDebitCardWithLinks:
      type: object
      description: Data structure containing information about a debit card and the bank with which it is held
      properties:
        card:
          $ref: "#/components/schemas/WrapperDebitCard"
        bank:
          $ref: "#/components/schemas/Bank"
    WrapperPrepaidCardWithLinks:
      type: object
      description: Data structure containing information about a prepaid card and the bank with which it is held
      properties:
        card:
          $ref: "#/components/schemas/WrapperPrepaidCard"
        bank:
          $ref: "#/components/schemas/Bank"
    WrapperCardWithLinks:
      type: object
      description: Data structure containing information about a card and the bank with which it is held
      properties:
        card:
          $ref: "#/components/schemas/Card"
        bank:
          $ref: "#/components/schemas/Bank"
    WrapperDebitCard:
      x-bizObjRef: Card
      type: object
      description: Data structure containing information about a card
      properties:
        cardId:
          type: string
          description:
            Card ID that is used to uniquely identify the card in card-related operations. For internal use, the value
            does not require tokenization.
          example: "4547420008209985"
        cardIdentification:
          type: object
          description: Data structure containing identification information for a card
          properties:
            displayNumber:
              type: string
              description: |-
                Displayed card number.

                The value must be obfuscated.
              example: xxxx-xxxx-xxxx-5643
        type:
          type: string
          description: Card type that defines the operations for which it can be used
          example: Credit card
        typeCode:
          type: string
          description: Card type code
          example: "01"
        typeDescription:
          type: string
          description: Card type description
          example: Visa Oro 123
        product:
          type: object
          description: Data structure containing product information. Products can be services or goods.
          properties:
            productCode:
              type: string
              description: Product code
              example: "0049300130"
            productDescription:
              type: string
              description: Product description
              example: Santander Checking Account
        capabilityLevel:
          type: string
          description: |-
            Level of capability that a back-end or the card processor can provide. The level determines the quick actions that the front-end can present to the customer.

            The possible values are:
            - PA = PAMPA capability level
            - PC = PCAS capability level
            - PL = Plard capability level
          enum:
            - PA
            - PC
            - PL
          example: PL
        contract:
          type: object
          description: Data structure containing information about a card contract
          properties:
            cardContractId:
              type: string
              description: Unique card contract ID
              example: "123454523"
            cardContractIdentification:
              type: object
              description: Data structure containing information related to card contract identification
              properties:
                internalIdentification:
                  type: string
                  description: Internal card contract ID, such as the account number in Partenón or in Altair
                  example: "031700015000501323"
        statusInfo:
          type: object
          description: Data structure containing information about an item's status
          properties:
            statusCode:
              type: string
              description: Status code
              example: CANC
            statusDescription:
              type: string
              description: Status description
              example: Inactive
            statusReasonCode:
              type: string
              description: Code for the status reason
              example: DQUA
            statusReasonDescription:
              type: string
              description: Description of the status reason
              example: Stolen
        blocks:
          type: array
          description: Array of blocks associated with the card
          items:
            type: object
            description: Data structure containing information about a card block
            properties:
              code:
                type: string
                description: Card block code
                example: "20"
        embossing:
          type: object
          description: Data structure containing information about a card's embossing
          properties:
            embossingId:
              type: string
              description: Unique embossing ID
              example: AE01066
            cardArtCode:
              type: string
              description: Code for the image stamped on the card
              maxLength: 3
              example: "001"
        cardholder:
          type: object
          description:
            Data structure containing information about a cardholder. A cardholder is a person authorized to perform
            operations with a specific card.
          properties:
            cardholderId:
              type: string
              description: Unique cardholder ID
              example: F123456789
            typeCode:
              type: string
              description:
                Code for the cardholder type that represents either the attributes or the operability of the cardholder
                with respect to their card. For example, the card has a limit that can be assigned to the cardholder in
                either an independent or an aggregated way, where the code determines how the limit is managed.
              example: "01"
            typeDescription:
              type: string
              description:
                Description of the cardholder type that represents either the attributes or the operability of the
                cardholder with respect to their card
              example: Independent
        balances:
          type: array
          description: Array of balances
          items:
            type: object
            description:
              Data structure containing a numerical representation of the net increases and decreases in an account at a
              specific point in time
            properties:
              amount:
                $ref: "#/components/schemas/Amount"
              typeCode:
                type: string
                description: |-
                  Balance type code.

                  The following value pairs show the mapping of the possible balance types to balance types used in other APIs:
                  - Authorized = AUT
                  - Available = AVL
                  - Charged = AVL (for prepaid cards)
                  - Drawn = CUR
                  - Limit = CRL
                  - Outstanding = OSB
                  - Spent_Month = POS
                enum:
                  - Authorized
                  - Available
                  - Charged
                  - Drawn
                  - Limit
                  - Outstanding
                  - Spent_Month
                example: Drawn
              typeDescription:
                type: string
                description: Balance type description
                example: Drawn
              lastUpdateDate:
                type: string
                format: date
                description: |-
                  Date when the balance was last updated.

                  The value uses the complete data format defined in ISO 8601:

                  'YYYY-MM-DD'

                  Where:
                  - YYYY: 4-digit year
                  - MM: 2-digit month (for example, 01 = January)
                  - DD: 2-digit day of the month (01 through 31)
                example: "2026-02-01"
              lastUpdateDateTime:
                type: string
                format: date-time
                description: |-
                  Date and time when the balance was last updated.

                  The value uses the complete data format defined in ISO 8601:

                  'YYYY-MM-DDThh:mm:ss.sssTZD'

                  Where:
                  - YYYY: 4-digit year
                  - MM: 2-digit month (for example, 01 = January)
                  - DD: 2-digit day of the month (01 through 31)
                  - hh: 2-digit hour of the day (00 through 23)
                  - mm: 2-digit minute of the hour (00 through 59)
                  - ss.sss: 5-digit seconds and milliseconds, separated by a point
                  - TZD: Time zone indicator
                example: "2026-02-01T17:32:28.123Z"
              countervalueAmount:
                $ref: "#/components/schemas/Amount"
        associatedAccount:
          type: object
          description: Data structure containing information about an associated account
          properties:
            account:
              type: object
              description: Data structure containing information about an account
              properties:
                accountId:
                  type: string
                  description: Unique account ID
                  example: "00491655300123456700"
                accountIdentification:
                  type: object
                  description: Data structure containing information related to account identification
                  properties:
                    internationalIdentification:
                      type: string
                      description: International Bank Account Number (IBAN)
                      example: ES9121000418450200051332
                    nationalIdentification:
                      type: string
                      description: National bank account number
                      example: "902127899967676767"
    WrapperPrepaidCard:
      x-bizObjRef: Card
      type: object
      description: Data structure containing information about a card
      properties:
        cardId:
          type: string
          description:
            Card ID that is used to uniquely identify the card in card-related operations. For internal use, the value
            does not require tokenization.
          example: "4547420008209985"
        cardIdentification:
          type: object
          description: Data structure containing identification information for a card
          properties:
            displayNumber:
              type: string
              description: |-
                Displayed card number.

                The value must be obfuscated.
              example: xxxx-xxxx-xxxx-5643
        type:
          type: string
          description: Card type that defines the operations for which it can be used
          example: Prepaid card
        typeCode:
          type: string
          description: Card type code
          example: "01"
        typeDescription:
          type: string
          description: Card type description
          example: Visa Oro 123
        capabilityLevel:
          type: string
          description: |-
            Level of capability that a back-end or the card processor can provide. The level determines the quick actions that the front-end can present to the customer.

            The possible values are:
            - PA = PAMPA capability level
            - PC = PCAS capability level
            - PL = Plard capability level
          enum:
            - PA
            - PC
            - PL
          example: PL
        product:
          type: object
          description: Data structure containing product information. Products can be services or goods.
          properties:
            productCode:
              type: string
              description: Product code
              example: "0049300130"
            productDescription:
              type: string
              description: Product description
              example: Santander Checking Account
        contract:
          type: object
          description: Data structure containing information about a card contract
          properties:
            cardContractId:
              type: string
              description: Unique card contract ID
              example: "123454523"
            cardContractIdentification:
              type: object
              description: Data structure containing information related to card contract identification
              properties:
                internalIdentification:
                  type: string
                  description: Internal card contract ID, such as the account number in Partenón or in Altair
                  example: "031700015000501323"
            nextStatementOpenDate:
              type: string
              format: date
              description: |-
                Opening date for the next statement period.

                The value uses the complete data format defined in ISO 8601:

                'YYYY-MM-DD'
                Where:
                - YYYY: 4-digit year
                - MM: 2-digit month (for example, 01 = January)
                - DD: 2-digit day of the month (01 through 31)
              example: "2026-02-24"
            statement:
              $ref: "#/components/schemas/Statement"
        statusInfo:
          type: object
          description: Data structure containing information about an item's status
          properties:
            statusCode:
              type: string
              description: Status code
              example: CANC
            statusDescription:
              type: string
              description: Status description
              example: Inactive
            statusReasonCode:
              type: string
              description: Code for the status reason
              example: DQUA
            statusReasonDescription:
              type: string
              description: Description of the status reason
              example: Stolen
        blocks:
          type: array
          description: Array of blocks associated with the card
          items:
            type: object
            description: Data structure containing information about a card block
            properties:
              code:
                type: string
                description: Card block code
                example: "10"
        embossing:
          type: object
          description: Data structure containing information about a card's embossing
          properties:
            embossingId:
              type: string
              description: Unique embossing ID
              example: AE01066
            cardArtCode:
              type: string
              description: Code for the image stamped on the card
              maxLength: 3
              example: "001"
        cardholder:
          type: object
          description:
            Data structure containing information about a cardholder. A cardholder is a person authorized to perform
            operations with a specific card.
          properties:
            cardholderId:
              type: string
              description: Unique cardholder ID
              example: F123456789
            typeCode:
              type: string
              description:
                Code for the cardholder type that represents either the attributes or the operability of the cardholder
                with respect to their card. For example, the card has a limit that can be assigned to the cardholder in
                either an independent or an aggregated way, where the code determines how the limit is managed.
              example: "01"
            typeDescription:
              type: string
              description:
                Description of the cardholder type that represents either the attributes or the operability of the
                cardholder with respect to their card
              example: Independent
        balances:
          type: array
          description: Array of balances
          items:
            type: object
            description:
              Data structure containing a numerical representation of the net increases and decreases in an account at a
              specific point in time
            properties:
              amount:
                $ref: "#/components/schemas/Amount"
              typeCode:
                type: string
                description: |-
                  Balance type code.

                  The following value pairs show the mapping of the possible balance types to balance types used in other APIs:
                  - Authorized = AUT
                  - Available = AVL
                  - Charged = AVL (for prepaid cards)
                  - Drawn = CUR
                  - Limit = CRL
                  - Outstanding = OSB
                  - Spent_Month = POS
                enum:
                  - Authorized
                  - Available
                  - Charged
                  - Drawn
                  - Limit
                  - Outstanding
                  - Spent_Month
                example: Drawn
              typeDescription:
                type: string
                description: Balance type description
                example: Drawn
              lastUpdateDate:
                type: string
                format: date
                description: |-
                  Date when the balance was last updated.

                  The value uses the complete data format defined in ISO 8601:

                  'YYYY-MM-DD'

                  Where:
                  - YYYY: 4-digit year
                  - MM: 2-digit month (for example, 01 = January)
                  - DD: 2-digit day of the month (01 through 31)
                example: "2026-02-01"
              lastUpdateDateTime:
                type: string
                format: date-time
                description: |-
                  Date and time when the balance was last updated.

                  The value uses the complete data format defined in ISO 8601:

                  'YYYY-MM-DDThh:mm:ss.sssTZD'

                  Where:
                  - YYYY: 4-digit year
                  - MM: 2-digit month (for example, 01 = January)
                  - DD: 2-digit day of the month (01 through 31)
                  - hh: 2-digit hour of the day (00 through 23)
                  - mm: 2-digit minute of the hour (00 through 59)
                  - ss.sss: 5-digit seconds and milliseconds, separated by a point
                  - TZD: Time zone indicator
                example: "2026-02-01T17:32:28.123Z"
              countervalueAmount:
                $ref: "#/components/schemas/Amount"
        associatedAccount:
          type: object
          description: Data structure containing information about an associated account
          properties:
            account:
              type: object
              description: Data structure containing information about an account
              properties:
                accountId:
                  type: string
                  description: Unique account ID
                  example: "00491655300123456700"
                accountIdentification:
                  type: object
                  description: Data structure containing information related to account identification
                  properties:
                    internationalIdentification:
                      type: string
                      description: International Bank Account Number (IBAN)
                      example: ES9121000418450200051332
                    nationalIdentification:
                      type: string
                      description: National bank account number
                      example: "902127899967676767"
    Card:
      type: object
      description: Data structure containing information about a card
      properties:
        cardId:
          type: string
          description:
            Card ID that is used to uniquely identify the card in card-related operations. For internal use, the value
            does not require tokenization.
          example: "4547420008209985"
        cardIdentification:
          type: object
          description: Data structure containing identification information for a card
          properties:
            displayNumber:
              type: string
              description: |-
                Displayed card number.

                The value must be obfuscated.
              example: xxxx-xxxx-xxxx-5643
        type:
          type: string
          description: Card type that defines the operations for which it can be used
          example: Credit card
        typeCode:
          type: string
          description: Card type code
          example: "01"
        typeDescription:
          type: string
          description: Card type description
          example: Visa Oro 123
        creditLimitLevel:
          type: object
          description:
            Data structure containing information about the structural level at which the card's credit limit is
            managed. The credit limit can be managed at customer, card contract, or card level.
          properties:
            levelCode:
              type: string
              description: |-
                Code for the credit limit's structural management level.

                The possible values are:
                - cus = Credit limit is managed at customer level. All cards and contracts use the credit limit that was assigned to the customer.
                - con = Credit limit is managed at card contract level. Each contract has its own credit limit and all cards within a contract use that contract's limit.
                - crd = Credit limit is managed at individual card level. Each card has its own credit limit that it uses independently.
              enum:
                - cus
                - con
                - crd
              example: cus
            levelDescription:
              type: string
              description: Description of the credit limit's structural management level
              example: Customer
        capabilityLevel:
          type: string
          description: |-
            Level of capability that a back-end or the card processor can provide. The level determines the quick actions that the front-end can present to the customer.

            The possible values are:
            - PA = PAMPA capability level
            - PC = PCAS capability level
            - PL = Plard capability level
          enum:
            - PA
            - PC
            - PL
          example: PL
        product:
          $ref: "#/components/schemas/Product"
        contract:
          type: object
          description: Data structure containing information about a card contract
          properties:
            cardContractId:
              type: string
              description: Unique card contract ID
              example: "123454523"
            cardContractIdentification:
              type: object
              description: Data structure containing information related to card contract identification
              properties:
                internalIdentification:
                  type: string
                  description: Internal card contract ID, such as the account number in Partenón or in Altair
                  example: "031700015000501323"
            nextStatementOpenDate:
              type: string
              format: date
              description: |-
                Opening date for the next statement period.

                The value uses the complete data format defined in ISO 8601:

                'YYYY-MM-DD'
                Where:
                - YYYY: 4-digit year
                - MM: 2-digit month (for example, 01 = January)
                - DD: 2-digit day of the month (01 through 31)
              example: "2026-02-24"
            statement:
              $ref: "#/components/schemas/Statement"
        statusInfo:
          type: object
          description: Data structure containing information about an item's status
          properties:
            statusCode:
              type: string
              description: Status code
              example: CANC
            statusDescription:
              type: string
              description: Status description
              example: Inactive
            statusReasonCode:
              type: string
              description: Code for the status reason
              example: DQUA
            statusReasonDescription:
              type: string
              description: Description of the status reason
              example: Stolen
        blocks:
          type: array
          description: Array of blocks associated with the card
          items:
            type: object
            description: Data structure containing information about a card block
            properties:
              code:
                type: string
                description: Card block code
                example: "10"
        embossing:
          type: object
          description: Data structure containing information about a card's embossing
          properties:
            embossingId:
              type: string
              description: Unique embossing ID
              example: AE01066
            cardArtCode:
              type: string
              description: Code for the image stamped on the card
              maxLength: 3
              example: "001"
        cardholder:
          type: object
          description:
            Data structure containing information about a cardholder. A cardholder is a person authorized to perform
            operations with a specific card.
          properties:
            cardholderId:
              type: string
              description: Unique cardholder ID
              example: F123456789
            typeCode:
              type: string
              description:
                Code for the cardholder type that represents either the attributes or the operability of the cardholder
                with respect to their card. For example, the card has a limit that can be assigned to the cardholder in
                either an independent or an aggregated way, where the code determines how the limit is managed.
              example: "01"
            typeDescription:
              type: string
              description:
                Description of the cardholder type that represents either the attributes or the operability of the
                cardholder with respect to their card
              example: Independent
        balances:
          type: array
          description: Array of balances
          items:
            type: object
            description:
              Data structure containing a numerical representation of the net increases and decreases in an account at a
              specific point in time
            properties:
              amount:
                $ref: "#/components/schemas/Amount"
              typeCode:
                type: string
                description: |-
                  Balance type code.

                  The following value pairs show the mapping of the possible balance types to balance types used in other APIs:
                  - Authorized = AUT
                  - Available = AVL
                  - Charged = AVL (for prepaid cards)
                  - Drawn = CUR
                  - Limit = CRL
                  - Outstanding = OSB
                  - Spent_Month = POS
                enum:
                  - Authorized
                  - Available
                  - Charged
                  - Drawn
                  - Limit
                  - Outstanding
                  - Spent_Month
                example: Drawn
              typeDescription:
                type: string
                description: Balance type description
                example: Drawn
              lastUpdateDate:
                type: string
                format: date
                description: |-
                  Date when the balance was last updated.

                  The value uses the complete data format defined in ISO 8601:

                  'YYYY-MM-DD'

                  Where:
                  - YYYY: 4-digit year
                  - MM: 2-digit month (for example, 01 = January)
                  - DD: 2-digit day of the month (01 through 31)
                example: "2026-02-01"
              lastUpdateDateTime:
                type: string
                format: date-time
                description: |-
                  Date and time when the balance was last updated.

                  The value uses the complete data format defined in ISO 8601:

                  'YYYY-MM-DDThh:mm:ss.sssTZD'

                  Where:
                  - YYYY: 4-digit year
                  - MM: 2-digit month (for example, 01 = January)
                  - DD: 2-digit day of the month (01 through 31)
                  - hh: 2-digit hour of the day (00 through 23)
                  - mm: 2-digit minute of the hour (00 through 59)
                  - ss.sss: 5-digit seconds and milliseconds, separated by a point
                  - TZD: Time zone indicator
                example: "2026-02-01T17:32:28.123Z"
              countervalueAmount:
                $ref: "#/components/schemas/Amount"
        associatedAccount:
          type: object
          description: Data structure containing information about an associated account
          properties:
            account:
              type: object
              description: Data structure containing information about an account
              properties:
                accountId:
                  type: string
                  description: Unique account ID
                  example: "00491655300123456700"
                accountIdentification:
                  type: object
                  description: Data structure containing information related to account identification
                  properties:
                    internationalIdentification:
                      type: string
                      description: International Bank Account Number (IBAN)
                      example: ES9121000418450200051332
                    nationalIdentification:
                      type: string
                      description: National bank account number
                      example: "902127899967676767"
    Amount:
      type: object
      description: Data structure containing amount details
      properties:
        amount:
          type: number
          description: |-
            Amount.

            The value uses the data format defined in ISO 20022 and has a maximum of 18 digits, of which 5 can be decimals, separated by a point.
          example: 99.99
        currency:
          type: string
          description: |-
            Currency code.

            The value is in the alpha-3 format defined in ISO 4217 (https://www.iso.org/iso-4217-currency-codes.html).
          minLength: 3
          maxLength: 3
          pattern: (^.{3}$)
          example: EUR
    Bank:
      type: object
      description: Data structure containing information about a bank
      properties:
        bankId:
          type: string
          description: Unique bank ID
          example: AAOZ
        center:
          $ref: "#/components/schemas/Center"
    Center:
      type: object
      description: Data structure containing information about a bank centre
      properties:
        centerId:
          type: string
          description: Bank centre ID
          example: "1001"
    Product:
      type: object
      description: Data structure containing product information. Products can be services or goods.
      properties:
        productCode:
          type: string
          description: Product code
          example: "0049300130"
        productDescription:
          type: string
          description: Product description
          example: Santander Checking Account
        hasUnlimitedCredit:
          type: boolean
          description: Whether the product has unlimited credit
          example: true
    Statement:
      type: object
      description: Data structure containing information about a statement
      properties:
        period:
          $ref: "#/components/schemas/Period"
        statusInfo:
          $ref: "#/components/schemas/StatusInfo"
    Period:
      type: object
      description: Data structure containing information about a period
      properties:
        endDate:
          type: string
          format: date
          description: |-
            Date when the period ends.

            The value uses the complete data format defined in ISO 8601:

            'YYYY-MM-DD'

            Where:
            - YYYY: 4-digit year
            - MM: 2-digit month (for example, 01 = January)
            - DD: 2-digit day of the month (01 through 31)
          example: "2026-02-28"
        startDate:
          type: string
          format: date
          description: |-
            Date when the period starts.

            The value uses the complete data format defined in ISO 8601:

            'YYYY-MM-DD'

            Where:
            - YYYY: 4-digit year
            - MM: 2-digit month (for example, 01 = January)
            - DD: 2-digit day of the month (01 through 31)
          example: "2026-02-01"
    StatusInfo:
      type: object
      description: Data structure containing information about an item's status
      properties:
        statusCode:
          type: string
          description: Status code
          example: CANC
        statusDescription:
          type: string
          description: Status description
          example: Cancelled
    Errors:
      type: object
      description: Data structure containing the details for errors
      properties:
        errors:
          type: array
          description: Array of errors
          items:
            $ref: "#/components/schemas/Error"
    Error:
      type: object
      description: Data structure containing the error details
      properties:
        code:
          type: string
          description: Unique alphanumeric human readable error code
          example: ERR001
        message:
          type: string
          description: Brief summary of the reported issue
          example: Invalid action
        level:
          type: string
          description: Level of the reported issue
          enum:
            - info
            - warning
            - error
          example: error
        description:
          type: string
          description: Detailed description of the reported issue
          example: Information about the returned error, used to resolve it
